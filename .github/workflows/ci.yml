name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # files committed from Windows lose the executable bit
      - name: Make scripts executable
        run: chmod +x build.sh test.sh bin/scaleetl

      - name: Build
        run: ./build.sh

      - name: End-to-end test (500k rows)
        run: ./test.sh 500000